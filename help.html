<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=240, height=320, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Help - Four In A Row</title>
  <link rel="icon" href="icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>Help</header>

  <div id="app">
    <h2>Objective</h2>
    <p>Drop discs to connect four of your own (red) in a row &mdash; horizontally, vertically, or diagonally &mdash; before the CPU (yellow) does.</p>

    <h2>Controls</h2>
    <p>4 &mdash; move left<br />
       6 &mdash; move right<br />
       5 or 8 &mdash; drop disc (fire)<br />
       0 &mdash; pause / resume<br />
       Menu (left key) &mdash; open menu<br />
       Back (right key) &mdash; exit</p>
  </div>

  <footer>
    <span id="softkey-left"></span>
    <span id="softkey-center"></span>
    <span id="softkey-right">Back</span>
  </footer>

  <script src="common.js"></script>
  <script>
    bindRightSoftKeySecondary('index.html');
  </script>
</body>
</html>
